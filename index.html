<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elinks</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=set3" />
  <script>
    if (navigator.userAgent.includes("Electron")) document.documentElement.classList.add("is-desktop");
  </script>
</head>
<body>
  <div class="app">
    <div class="ripples" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <header class="top">
      <div class="brand">
        <img class="brand-mark" src="assets/mark.svg" width="20" height="20" alt="" />
        <div class="brand-name">Elinks</div>
        <span class="brand-sub">桌面接收</span>
      </div>
      <div class="top-actions">
        <div class="net" id="net-chip" title="当前接收速度 / 网卡链路可到的最高速度">
          <span class="net-now"><b id="now-mps">0</b> M/s</span>
          <span class="net-cap">最高 <b id="cap-mps">—</b> M/s</span>
        </div>
        <span class="pass-flag" id="pass-flag" hidden>需要密码</span>
        <nav class="top-nav">
          <button type="button" class="nav" id="open-settings">设置</button>
          <button type="button" class="nav" id="open-phone">手机页</button>
          <button type="button" class="nav" id="mode">查看接收</button>
          <button type="button" class="nav" id="open-dir">打开目录</button>
        </nav>
      </div>
    </header>

    <section class="stage" aria-label="等待接收">
      <div class="stage-main">
        <div class="listen">
          <div class="plate">
            <canvas id="qr" aria-label="接收页二维码，手机扫码后选择照片或视频"></canvas>
          </div>
        </div>
      </div>
      <div class="stage-copy">
        <h1 id="stage-title">等待接收</h1>
        <p id="stage-lead">用手机相机扫码，就会打开选照片。手机要和这台电脑在同一个网络。</p>
        <button type="button" class="join-wifi" id="join-wifi" hidden>
          <strong id="join-wifi-title">手机扫了却打不开？</strong>
          <span id="join-wifi-copy">点这里，改扫加入电脑 Wi-Fi 的码，不用输密码</span>
        </button>
        <label class="address-box">
          <span>在手机里打开或粘贴</span>
          <span class="address-field">
            <input id="desk-host" readonly value="192.168.1.24:8730" aria-label="接收地址，点击复制" />
            <button type="button" class="copy-chip" id="copy-host">复制</button>
          </span>
        </label>
      </div>
    </section>

    <section class="sheet" id="settings" hidden>
      <h2>接收设置</h2>
      <label for="save-path">保存路径</label>
      <input id="save-path" spellcheck="false" autocomplete="off" />
      <label for="receive-password">接收密码</label>
      <div class="pass-row">
        <input id="receive-password" type="text" autocomplete="off" placeholder="留空则扫码后直接进入" />
        <button type="button" class="text" id="random-password">随机</button>
      </div>
      <div class="switch-row">
        <span>背景动画</span>
        <button type="button" class="switch on" id="rings-toggle" role="switch" aria-checked="true" aria-label="背景动画"></button>
      </div>
      <div class="update-row">
        <span>版本 <b id="app-version">0.1.0</b></span>
        <button type="button" class="text" id="check-update">检查更新</button>
      </div>
      <p class="update-status" id="update-status"></p>
      <p>扫码和复制的地址会带上密码，手机不用再填。路径和动画开关会保留到下次打开。</p>
      <button type="button" class="text" id="close-settings">完成</button>
    </section>

    <section class="phone" aria-label="手机连接">
      <form class="join" id="join-form">
        <h1>连接到电脑</h1>
        <p class="join-lead">扫码会带上地址。也可以自己输入 IP。</p>
        <label for="host">电脑地址</label>
        <input id="host" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.1.24:8730" />
        <div class="pass-slot" id="password-block">
          <div>
            <label for="join-password">接收密码</label>
            <input id="join-password" type="password" autocomplete="current-password" />
            <p class="error" id="password-error" hidden>密码不正确</p>
          </div>
        </div>
        <div class="join-actions">
          <button type="submit" class="fill" id="join-go">连接</button>
          <button type="button" class="text" id="scan">按扫码进入</button>
        </div>
      </form>
      <div class="pick" id="pick" hidden>
        <h1>选择照片或视频</h1>
        <p>选中后立即开始上传，原文件、多路并行。</p>
        <button type="button" class="fill" id="pick-files">选择照片和视频</button>
      </div>
    </section>

    <section class="busy" aria-label="正在接收">
      <div class="meter">
        <div class="meter-figure">
          <strong id="mbps">0</strong>
          <span>M/s</span>
          <em id="mbs">0 M/s</em>
        </div>
        <div class="track" aria-hidden="true"><i id="meter-fill"></i></div>
        <div class="meter-side">
          <b id="util">0%</b>
          <span id="lane-count">并行接收</span>
        </div>
      </div>

      <div class="list">
        <div class="section-head">
          <h2>正在接收</h2>
          <span id="active-count">等待发送</span>
        </div>
        <div id="live-list"></div>
        <div class="section-head done-head">
          <h2>已完成</h2>
          <span>保存在接收目录</span>
        </div>
        <div id="live-done"></div>
      </div>
    </section>

    <footer class="status">
      <label class="path">
        <svg class="path-mark" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1.7 5.4V4.3c0-.7.6-1.3 1.3-1.3h3.1L7.4 4.3h6.6c.7 0 1.3.6 1.3 1.3v1.3" fill="none" stroke="#1f6feb" stroke-width="1.35" stroke-linejoin="round"/>
          <rect x="1.7" y="5.4" width="12.6" height="8.2" rx="1.3" fill="none" stroke="#1f6feb" stroke-width="1.35"/>
        </svg>
        保存到 <input id="save-path-bar" spellcheck="false" />
      </label>
      <div class="credit">Power by EndLessGo - vFREE</div>
      <div id="today">今天已接收 0 个文件</div>
    </footer>
  </div>
  <input id="file-input" type="file" accept="image/*,video/*,.heic,.heif,.mov,.mp4" multiple hidden />
  <script src="app.js?v=set3"></script>
  <script src="live.js?v=set3"></script>
</body>
</html>
