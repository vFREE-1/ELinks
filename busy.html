<!DOCTYPE html>
<html lang="zh-CN" class="is-busy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Links 传输中</title>
  <link rel="stylesheet" href="styles.css?v=ring3" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="#1f6feb" stroke-width="1.6"/>
          <rect x="8.5" y="8.5" width="11" height="11" rx="2.5" fill="none" stroke="#1f6feb" stroke-width="1.6"/>
        </svg>
        <div>
          <div class="brand-name">Links</div>
          <span class="brand-sub">传输演示</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="net"><i class="live-dot"></i>千兆局域网</span>
        <span class="pass-flag">iPhone 正在发送</span>
        <a class="text" href="index.html">等待画面</a>
      </div>
    </header>

    <section class="busy" aria-label="正在接收">
      <div class="meter">
        <div class="meter-figure">
          <strong id="mbps">930</strong>
          <span>Mbps</span>
          <em id="mbs">116 MB/s</em>
        </div>
        <div class="track" aria-hidden="true"><i id="meter-fill"></i></div>
        <div class="meter-side">
          <b id="util">99%</b>
          <span id="lane-count">24 路 · 不切片</span>
        </div>
      </div>

      <div class="list">
        <div class="section-head">
          <h2>正在接收</h2>
          <span id="active-count">10 个文件并行</span>
        </div>
        <div id="live-list"></div>
        <div class="section-head done-head">
          <h2>已完成</h2>
          <span>保存在接收目录</span>
        </div>
        <div id="done-list">
          <div class="done-row"><b>晚会彩排.mp4</b><span>1.10 GB</span><span>11 秒</span><span>102 MB/s</span></div>
          <div class="done-row"><b>IMG_8824.HEIC</b><span>4.8 MB</span><span>1 秒</span><span>并行完成</span></div>
          <div class="done-row"><b>门口.JPG</b><span>6.1 MB</span><span>1 秒</span><span>并行完成</span></div>
        </div>
      </div>
    </section>

    <footer class="status">
      <label class="path"><i class="path-mark"></i>保存到 <input id="save-path-bar" spellcheck="false" value="D:\Links\接收" readonly /></label>
      <div id="today">今天已接收 3 个文件 · 1.11 GB</div>
    </footer>
  </div>
  <script src="busy.js"></script>
</body>
</html>
