<!DOCTYPE html>
<html lang="zh-CN" class="phone-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>传到电脑</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=set15" />
</head>
<body>
  <main class="phone-app">
    <header class="phone-brand">
      <img src="assets/mark.svg" width="22" height="22" alt="" />
      <span>Elinks</span>
    </header>
    <p class="phone-status" id="phone-status">选好就传到这台电脑，不用再改地址。</p>
    <p class="phone-hint mix-hint" id="wechat-hint" hidden>微信相册不能照片和视频一起选。弹出后选「文件」，或点右上角用浏览器打开。一次大约最多 100 个，不是上传限制。</p>
    <form class="phone-pass" id="join-pass" hidden>
      <label for="join-password">接收密码</label>
      <input id="join-password" type="password" autocomplete="current-password" />
      <p class="error" id="password-error" hidden>密码不正确</p>
      <button type="submit" class="fill">确认</button>
    </form>
    <label class="pick-entry" id="pick">
      <input id="file-input" type="file" accept="image/*,video/*,.heic,.heif,.dng,.mov,.mp4,.m4v,.jpg,.jpeg,.png,.webp,.gif" multiple />
      <strong id="pick-label">选择照片和视频</strong>
    </label>
    <section class="phone-send" id="send" hidden>
      <div class="phone-meter">
        <strong id="send-pct">0%</strong>
        <p id="send-lead">正在上传</p>
        <p class="phone-meter-sub" id="send-count">0 / 0</p>
      </div>
      <div class="phone-track" aria-hidden="true"><i id="send-fill"></i></div>
      <div id="send-list"></div>
      <button type="button" class="text" id="send-stop" hidden>停止这一批</button>
    </section>
  </main>
  <script type="module" src="phone.js?v=set17"></script>
</body>
</html>
