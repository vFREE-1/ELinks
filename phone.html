<!DOCTYPE html>
<html lang="zh-CN" class="phone-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>传到电脑</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=set10" />
</head>
<body>
  <main class="phone-app">
    <header class="phone-brand">
      <img src="assets/mark.svg" width="22" height="22" alt="" />
      <span>Elinks</span>
    </header>
    <p class="phone-status" id="phone-status">选好就传到这台电脑，不用再改地址。</p>
    <form class="phone-pass" id="join-pass" hidden>
      <label for="join-password">接收密码</label>
      <input id="join-password" type="password" autocomplete="current-password" />
      <p class="error" id="password-error" hidden>密码不正确</p>
      <button type="submit" class="fill">确认</button>
    </form>
    <label class="pick-entry" id="pick">
      <input id="file-input" type="file" accept="image/*,video/*,.heic,.heif,.dng,.mov,.mp4,.m4v,.jpg,.jpeg,.png,.webp,.gif" multiple />
      <strong>选择照片和视频</strong>
    </label>
    <section class="phone-send" id="send" hidden>
      <p id="send-lead">正在上传</p>
      <div id="send-list"></div>
      <label class="pick-entry pick-more">
        <input id="file-more" type="file" accept="image/*,video/*,.heic,.heif,.dng,.mov,.mp4,.m4v,.jpg,.jpeg,.png,.webp,.gif" multiple />
        <strong>再选一些</strong>
      </label>
    </section>
  </main>
  <script type="module" src="phone.js?v=set10"></script>
</body>
</html>
